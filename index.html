<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taomis</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Times New Roman", Times, serif;
        line-height: 1.7;
        padding: 3rem 1.5rem;
        color: #1a1a1a;
        display: flex;
        justify-content: center;
      }

      figure {
        max-width: 280px;
      }

      figure img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
      }

      figcaption {
        font-size: 0.85rem;
        text-align: center;
        margin-top: 0.3rem;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <figure>
        <img src="static/bird.png" alt="drawn image of a fat bird" />
        <figcaption>relatable</figcaption>
      </figure>
    </div>
  </body>
</html>
